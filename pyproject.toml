[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-reproducability"
version = "0.1.0"
description = "Audit research codebases for reproducibility issues"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Nisarg", email = "nisarg2543@gmail.com" }]
keywords = ["reproducibility", "research", "cfd", "fea", "science", "matlab"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
]

[project.scripts]
repro-check = "repro.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/Nisarg2543/research-reproducability"
Repository = "https://github.com/Nisarg2543/research-reproducability"
Issues = "https://github.com/Nisarg2543/research-reproducability/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/repro"]
include = ["src/repro/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["src/repro"]
omit = ["*/__pycache__/*"]
